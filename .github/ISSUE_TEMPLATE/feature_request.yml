name: ✨ Feature request
description: Suggest a new prompt, report type or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: A new prompt in `prompts/`, a knowledge file, a report section…
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
